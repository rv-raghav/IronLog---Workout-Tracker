<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111118"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Dumbbell bar -->
  <rect x="130" y="236" width="252" height="40" rx="20" fill="url(#fire)"/>
  <!-- Left weight -->
  <rect x="100" y="196" width="50" height="120" rx="12" fill="url(#fire)" opacity="0.9"/>
  <rect x="70" y="216" width="40" height="80" rx="10" fill="url(#fire)" opacity="0.7"/>
  <!-- Right weight -->
  <rect x="362" y="196" width="50" height="120" rx="12" fill="url(#fire)" opacity="0.9"/>
  <rect x="402" y="216" width="40" height="80" rx="10" fill="url(#fire)" opacity="0.7"/>
  <!-- Flame accent -->
  <circle cx="256" cy="150" r="35" fill="#f97316" opacity="0.3"/>
  <circle cx="256" cy="150" r="20" fill="#f97316" opacity="0.5"/>
</svg>
